name: EndlessFrontier
options:
  bundleIdPrefix: com.keks.endlessfrontier
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  EndlessFrontierCore:
    path: ../Core

targets:
  EndlessFrontier:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
    dependencies:
      - package: EndlessFrontierCore
        product: EndlessFrontierCore
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.keks.endlessfrontier
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"

  # The Core has 356 tests; the app had none, so everything the renderer does —
  # where a building is drawn, what a tap lands on, where the camera may go —
  # was only ever checked by the fact that it compiled.
  EndlessFrontierTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: EndlessFrontier
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.keks.endlessfrontier.tests
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
